# GitHub Secret Scanning / Push Protection allowlist.
#
# Paths listed here are skipped by secret scanning AND by push protection,
# so synthetic credential-shaped strings in tests and docs no longer block pushes.
# Only test fixtures, frozen baselines and documentation placeholders belong here.
# Do NOT add production source paths.
paths-ignore:
  # Go unit/integration tests: fake API keys, JWT-shaped and hex fixtures
  - "backend/**/*_test.go"
  - "backend/internal/testutil/**"

  # Frontend unit tests and fixture data
  - "frontend/**/__tests__/**"
  - "frontend/**/*.spec.ts"
  - "frontend/src/**/fixtures/**"

  # OpenSpec frozen source baselines / patches / manifests (intentional copies of upstream text)
  - "openspec/**"

  # Documentation samples and env examples
  - "docs/**"
  - "deploy/**"
  - "README.md"
  - "README_CN.md"
  - "README_JA.md"
  - "**/*.example"
  - "**/*.example.yaml"
